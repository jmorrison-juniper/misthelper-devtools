version: 2
updates:
  # Keeps the actions in `ci.yml` and in the shared workflows up to date. The
  # consumers call the shared workflows at a pinned commit, so the Dependabot
  # of a consumer cannot see these actions. A consumer gets an update after
  # the next release of this repository.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/mermaid-lint"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # reusable-codeql.yml uses the floating v4 tag. Take only major updates.
      # If Dependabot runs before GitHub moves the v4 tag, it replaces the tag
      # with an exact version.
      - dependency-name: "github/codeql-action"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "/.github/actions/mermaid-lint"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      mermaid-lint:
        patterns:
          - "*"
