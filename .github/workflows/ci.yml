name: CI

# One event starts one run. The push trigger is scoped to `main`, so a pull
# request does not start a second run for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: lint
            command: python -m ruff check .
          - name: format
            command: python -m black --check .
          - name: types
            # Check the whole package with the strict settings in pyproject.toml.
            command: python -m mypy -p misthelper_devtools --config-file pyproject.toml
          - name: tests
            command: python -m pytest --cov=misthelper_devtools --cov-report=term-missing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the package and the development group
        run: python -m pip install -e ".[dev]"

      - name: Run the ${{ matrix.gate.name }} gate
        run: ${{ matrix.gate.command }}

  # The Mist repositories call the reusable workflows in this repository, so a
  # workflow defect reaches every consumer. actionlint reads each workflow file
  # and runs shellcheck on each run block.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Check the workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color

  # The documentation and the agent instructions of this repository meet the
  # same STE rules that the shared workflow checks in each Mist repository.
  # The job reads `.ste-linter.toml`, the same settings that a consumer copies.
  # This job also tests the shared workflow on each pull request.
  ste-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ste-lint.yml
    with:
      files: README.md AGENTS.md .github/copilot-instructions.md docs/*.md documentation/*.md src/misthelper_devtools/**/README.md
      config: .ste-linter.toml

  # A Mist repository runs the hooks in .pre-commit-hooks.yaml. pre-commit
  # installs this commit in a separate environment and runs each hook, as it
  # does in a consumer repository.
  pre-commit-hooks:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run each hook from this commit
        run: pre-commit try-repo . --files README.md --verbose

  # This job calls the local composite action. It proves that a caller can use
  # the action before a release pins it. It also proves that bad syntax fails.
  mermaid-lint-action:
    name: mermaid-lint-action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run the local Mermaid action on valid syntax
        uses: ./.github/actions/mermaid-lint
        with:
          docs-dir: tests/fixtures/mermaid/valid
          extra-files: ""

      - name: Run the local Mermaid action on invalid syntax
        id: invalid-fixture
        continue-on-error: true
        uses: ./.github/actions/mermaid-lint
        with:
          docs-dir: tests/fixtures/mermaid/invalid
          extra-files: ""

      - name: Confirm the invalid fixture failed
        run: |
          if [ "${{ steps.invalid-fixture.outcome }}" != "failure" ]; then
            echo "The invalid Mermaid fixture passed unexpectedly."
            exit 1
          fi
          echo "The invalid Mermaid fixture failed as expected."

  # The aggregator always reports, so branch protection always receives a
  # status. It is the only check that a protection rule needs to require.
  ci-result:
    name: ci-result
    runs-on: ubuntu-latest
    needs: [gates, actionlint, ste-lint, pre-commit-hooks, mermaid-lint-action]
    if: always()
    steps:
      - name: Report the combined result
        run: |
          echo "The gate result is '${{ needs.gates.result }}'."
          echo "The actionlint result is '${{ needs.actionlint.result }}'."
          echo "The STE lint result is '${{ needs.ste-lint.result }}'."
          echo "The pre-commit hook result is '${{ needs.pre-commit-hooks.result }}'."
          echo "The Mermaid action result is '${{ needs.mermaid-lint-action.result }}'."
          if [ "${{ needs.gates.result }}" != "success" ] || [ "${{ needs.actionlint.result }}" != "success" ] || [ "${{ needs.ste-lint.result }}" != "success" ] || [ "${{ needs.pre-commit-hooks.result }}" != "success" ] || [ "${{ needs.mermaid-lint-action.result }}" != "success" ]; then
            echo "One gate failed or was skipped. Read the job list above."
            exit 1
          fi
          echo "Every gate passed."
