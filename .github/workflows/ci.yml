name: CI

# One event starts one run. The push trigger is scoped to `main`, so a pull
# request does not start a second run for the same commit.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  gates:
    name: ${{ matrix.gate.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gate:
          - name: lint
            command: python -m ruff check .
          - name: format
            command: python -m black --check .
          - name: types
            # The scope matches the original repository, which type-checked
            # its `src/` tree only. That tree is now the `juniper_skills`
            # sub-package. The other modules hold 60 known annotation defects.
            # A separate change repairs them and widens this scope.
            command: python -m mypy -p misthelper_devtools.juniper_skills --config-file pyproject.toml
          - name: tests
            command: python -m pytest --cov=misthelper_devtools --cov-report=term-missing
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install the package and the development group
        run: python -m pip install -e ".[dev]"

      - name: Run the ${{ matrix.gate.name }} gate
        run: ${{ matrix.gate.command }}

  # The Mist repositories call the reusable workflows in this repository, so a
  # workflow defect reaches every consumer. actionlint reads each workflow file
  # and runs shellcheck on each run block.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: Check the workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color

  # The documentation of this repository meets the same STE rules that the
  # shared workflow checks in each Mist repository. This job also tests the
  # shared workflow on each pull request.
  ste-lint:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-ste-lint.yml
    with:
      files: README.md documentation/*.md src/misthelper_devtools/**/README.md

  # The aggregator always reports, so branch protection always receives a
  # status. It is the only check that a protection rule needs to require.
  ci-result:
    name: ci-result
    runs-on: ubuntu-latest
    needs: [gates, actionlint, ste-lint]
    if: always()
    steps:
      - name: Report the combined result
        run: |
          echo "The gate result is '${{ needs.gates.result }}'."
          echo "The actionlint result is '${{ needs.actionlint.result }}'."
          echo "The STE lint result is '${{ needs.ste-lint.result }}'."
          if [ "${{ needs.gates.result }}" != "success" ] || [ "${{ needs.actionlint.result }}" != "success" ] || [ "${{ needs.ste-lint.result }}" != "success" ]; then
            echo "One gate failed or was skipped. Read the job list above."
            exit 1
          fi
          echo "Every gate passed."
