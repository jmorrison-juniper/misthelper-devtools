name: CodeQL

# This workflow scans the Python code of this repository with the shared
# CodeQL workflow. It is also the self-test of reusable-codeql.yml.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/reusable-codeql.yml
    with:
      languages: '["python"]'
      config-file: ./.github/codeql/codeql-config.yml
