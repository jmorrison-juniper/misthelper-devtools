# ================================================================
# Auto-merge -- merge a labeled pull request, then start the main workflows
# ================================================================
# A pull request with the auto-merge label merges after its required checks
# pass. The merge uses GITHUB_TOKEN.
#
# GitHub starts no workflow run from an event that GITHUB_TOKEN makes. The
# merge commit therefore starts no push run on the default branch, and the gate
# result, the code scan, and the container image all go stale. A
# workflow_dispatch call is the one exception that GitHub honors, so the second
# job starts each main workflow with an explicit dispatch call.
# jmorrison-juniper/MistHelper#1851 records the effect and the repair.
#
# A merged pull request stops reading its branch. A commit that reaches the
# branch after the merge therefore has no pull request, and no reviewer and no
# gate reads it. When report-orphaned-push is true, the third job reads each
# push to a branch and writes one notice on the merged pull request of that
# branch. jmorrison-juniper/MistHelper#1960 records a real loss of work.
#
# The caller workflow:
#
#   on:
#     pull_request:
#       types: [labeled, synchronize, opened, reopened, closed]
#     # The push trigger is necessary only for report-orphaned-push.
#     push:
#       branches-ignore: [main]
#     schedule:
#       - cron: '37 */6 * * *'
#     workflow_dispatch:
#   permissions: {}
#   jobs:
#     auto-merge:
#       permissions:
#         actions: write
#         contents: write
#         pull-requests: write
#       uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-auto-merge.yml@<commit>
#       with:
#         main-workflows: 'ci.yml codeql.yml container-build.yml'
#         report-orphaned-push: true
#
# Each workflow in main-workflows must accept workflow_dispatch. The schedule
# is the backstop for a merge that starts no closed event.
# ================================================================
name: Auto-merge (reusable)

on:
  workflow_call:
    inputs:
      label:
        description: The label that asks for auto-merge.
        required: false
        default: auto-merge
        type: string
      merge-method:
        description: The merge method. Use squash, merge, or rebase.
        required: false
        default: squash
        type: string
      main-workflows:
        description: The space-separated workflow files that a push to the default branch starts.
        required: false
        default: ''
        type: string
      default-branch:
        description: The branch that the pull requests merge into.
        required: false
        default: main
        type: string
      report-orphaned-push:
        description: Write a notice on a merged pull request when a later push adds a commit to its branch. The caller needs a push trigger.
        required: false
        default: false
        type: boolean

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    # A closed pull request cannot accept auto-merge, so the closed type stops
    # here.
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && contains(github.event.pull_request.labels.*.name, inputs.label)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The merge writes to the base branch.
      contents: write
      # The job sets the auto-merge state and writes one notice comment.
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # GITHUB_TOKEN has no workflow scope, so GitHub refuses a merge that
      # writes a file under .github/workflows/. The refusal happens inside the
      # merge call, and the pull request shows no reason.
      # jmorrison-juniper/MistHelper#1954 records the silent failure.
      - name: Check whether the pull request edits a workflow file
        id: workflow_guard
        shell: bash
        run: |
          set -euo pipefail

          if ! files="$(gh pr view "${PR_NUMBER}" --json files --jq '.files[].path')"; then
            echo "::error::The file list of pull request ${PR_NUMBER} did not load."
            exit 1
          fi

          if printf '%s\n' "${files}" | grep -q '^\.github/workflows/'; then
            echo "Pull request ${PR_NUMBER} edits a workflow file."
            echo "blocked=true" >> "${GITHUB_OUTPUT}"
          else
            echo "Pull request ${PR_NUMBER} edits no workflow file."
            echo "blocked=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Ask for a manual merge when a workflow file changed
        if: steps.workflow_guard.outputs.blocked == 'true'
        shell: bash
        env:
          # The marker keeps the comment unique. This job runs again on each
          # label event and on each push.
          MARKER: '<!-- auto-merge:workflow-scope-block -->'
          MERGE_METHOD: ${{ inputs.merge-method }}
        run: |
          set -euo pipefail

          if ! bodies="$(gh pr view "${PR_NUMBER}" --json comments --jq '.comments[].body')"; then
            echo "::error::The comment list of pull request ${PR_NUMBER} did not load."
            exit 1
          fi

          if printf '%s\n' "${bodies}" | grep -qF "${MARKER}"; then
            echo "The pull request already has the notice. Nothing to add."
            exit 0
          fi

          # Each line stays flush left after YAML removes the block indent, so
          # Markdown reads the body as prose and not as a code block.
          cat > "${RUNNER_TEMP}/workflow-block.md" <<EOF
          ${MARKER}
          **Auto-merge stopped. This pull request needs a manual merge.**

          This pull request edits a file under \`.github/workflows/\`. The
          auto-merge job merges with \`GITHUB_TOKEN\`. GitHub refuses to let that
          token write a workflow file, so the merge call fails.

          The refusal is a GitHub platform rule. No change to the
          \`permissions:\` block can clear it, because \`workflow\` is not a key
          that the block accepts.

          To merge this pull request, run the command below from an account that
          has the \`workflow\` scope.

          \`\`\`
          gh pr merge -R ${GH_REPO} --${MERGE_METHOD} ${PR_NUMBER}
          \`\`\`

          jmorrison-juniper/MistHelper#1954 records this constraint.
          EOF

          gh pr comment "${PR_NUMBER}" --body-file "${RUNNER_TEMP}/workflow-block.md"
          echo "Added the manual merge notice to pull request ${PR_NUMBER}."

      - name: Enable auto-merge
        # A blocked pull request skips the merge call. The call would fail and
        # would show the reason only in this run log.
        if: steps.workflow_guard.outputs.blocked == 'false'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ github.token }}
          pull-request-number: ${{ github.event.pull_request.number }}
          merge-method: ${{ inputs.merge-method }}

  dispatch-main-workflows:
    name: Start the main workflows that missed the tip
    # A merge into the default branch repairs the branch in seconds. The
    # schedule and a manual start repair it when no merge event arrives.
    if: >-
      inputs.main-workflows != ''
      && (github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == inputs.default-branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two merges close together start two jobs, and each job waits before it
    # starts a workflow. A dispatch runs on the newest tip, so the two jobs
    # would start two runs on the same commit. One job at a time checks the
    # tip, and a later job finds the runs of the earlier job.
    concurrency:
      group: auto-merge-dispatch-${{ github.repository }}-${{ inputs.default-branch }}
      cancel-in-progress: false
    permissions:
      # A dispatch call makes a workflow run, and the coverage check reads the
      # runs of each workflow.
      actions: write
      # The tip lookup reads one commit.
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAIN_WORKFLOWS: ${{ inputs.main-workflows }}
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
      # The job asks this many times, with this many seconds between, before
      # it starts a workflow that shows no run on the tip. Old answers came in
      # bursts of about a minute, so the checks span more than a minute.
      COVERAGE_CHECKS: '5'
      COVERAGE_CHECK_INTERVAL: '20'
    steps:
      - name: Start each main workflow that missed the tip
        shell: bash
        run: |
          set -uo pipefail

          # A comparison with the tip stops a duplicate run when a person merged
          # and the push already started the workflows.
          if ! tip="$(gh api "repos/${GH_REPO}/commits/${DEFAULT_BRANCH}" --jq '.sha')"; then
            echo "::error::The lookup of the tip of ${DEFAULT_BRANCH} failed. No workflow started."
            exit 1
          fi
          echo "The tip of ${DEFAULT_BRANCH} is ${tip}."

          # A workflow covers the tip when it has a run on the tip commit. The
          # newest run on the branch is not a safe test. The run list of GitHub
          # can answer from old data, and that answer started duplicate runs.
          # Old data cannot show a run that does not exist, so one run on the
          # tip is proof. An answer of no run can be wrong, so the job asks
          # again before it starts a workflow.
          current=''
          query="branch=${DEFAULT_BRANCH}&head_sha=${tip}&per_page=1"
          read -r -a pending <<< "${MAIN_WORKFLOWS}"
          check=1
          while :; do
            missed=()
            for workflow in "${pending[@]}"; do
              # The list also holds a queued run, so a dispatch from a moment
              # ago counts as coverage of the tip.
              runs="$(gh api "repos/${GH_REPO}/actions/workflows/${workflow}/runs?${query}" --jq '.total_count')" || runs='unknown'
              if [[ "${runs}" =~ ^[0-9]+$ ]] && [ "${runs}" -gt 0 ]; then
                echo "${workflow} already covers the tip."
                current="${current}${workflow} "
              else
                echo "Check ${check} of ${COVERAGE_CHECKS}: ${workflow} shows no run on the tip (${runs})."
                missed+=("${workflow}")
              fi
            done
            pending=("${missed[@]}")
            if [ "${#pending[@]}" -eq 0 ] || [ "${check}" -ge "${COVERAGE_CHECKS}" ]; then
              break
            fi
            sleep "${COVERAGE_CHECK_INTERVAL}"
            check=$((check + 1))
          done

          started=''
          failed=''
          for workflow in "${pending[@]}"; do
            echo "${workflow} showed no run on the tip in ${COVERAGE_CHECKS} checks, so the workflow missed the tip."
            # One failed call must not stop the other calls.
            if gh workflow run "${workflow}" --ref "${DEFAULT_BRANCH}"; then
              echo "Started ${workflow} on ${DEFAULT_BRANCH}."
              started="${started}${workflow} "
            else
              echo "::error::The dispatch call for ${workflow} on ${DEFAULT_BRANCH} failed."
              failed="${failed}${workflow} "
            fi
          done

          {
            echo "## Post-merge dispatch"
            echo ""
            echo "**Tip of ${DEFAULT_BRANCH}:** \`${tip}\`"
            echo ""
            echo "- **Started:** ${started:-none}"
            echo "- **Already current:** ${current:-none}"
            echo "- **Failed:** ${failed:-none}"
          } >> "${GITHUB_STEP_SUMMARY}"

          # The merge is complete. A dispatch failure is a separate fault.
          if [ -n "${failed}" ]; then
            echo "::error::The merge is complete. These workflows did not start: ${failed}"
            exit 1
          fi
          echo "Each main workflow now covers the tip of ${DEFAULT_BRANCH}."

  report-orphaned-push:
    name: Report a push that arrived after the merge
    # Only a push to a branch other than the default branch can orphan a
    # commit. A push that deletes a branch adds no commit.
    if: >-
      inputs.report-orphaned-push
      && github.event_name == 'push'
      && github.event.deleted != true
      && startsWith(github.ref, 'refs/heads/')
      && github.ref_name != inputs.default-branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The notice is one comment on the merged pull request.
      pull-requests: write
      # The compare calls read the commits.
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      PUSHED_SHA: ${{ github.sha }}
      DEFAULT_BRANCH: ${{ inputs.default-branch }}
    steps:
      - name: Write a notice on the merged pull request of the branch
        shell: bash
        run: |
          set -euo pipefail

          # An open pull request takes the push to a review.
          if ! open="$(gh pr list --head "${BRANCH}" --state open --limit 1 --json number --jq '.[0].number // empty')"; then
            echo "::error::The open pull requests of ${BRANCH} did not load."
            exit 1
          fi
          if [ -n "${open}" ]; then
            echo "Pull request #${open} is open for ${BRANCH}, so the push goes to a review."
            exit 0
          fi

          if ! merged="$(gh pr list --head "${BRANCH}" --state merged --limit 1 --json number,headRefOid --jq '.[0] // empty | "\(.number) \(.headRefOid)"')"; then
            echo "::error::The merged pull requests of ${BRANCH} did not load."
            exit 1
          fi
          if [ -z "${merged}" ]; then
            echo "Branch ${BRANCH} has no merged pull request. Nothing to report."
            exit 0
          fi
          read -r number merged_head <<< "${merged}"

          # Return 0 when the first commit holds the second commit. The
          # compare status is then identical or behind.
          holds() {
            local status
            if ! status="$(gh api "repos/${GH_REPO}/compare/$1...$2" --jq '.status')"; then
              echo "::error::The compare of $1 with $2 failed."
              exit 1
            fi
            [ "${status}" = "identical" ] || [ "${status}" = "behind" ]
          }

          # A squash merge puts no branch commit on the default branch, so
          # the last head of the pull request tells what the merge took.
          if holds "${merged_head}" "${PUSHED_SHA}"; then
            echo "Pull request #${number} merged commit ${PUSHED_SHA}. Nothing to report."
            exit 0
          fi
          # A merge commit or a rebase puts the branch commits on the default
          # branch.
          if holds "${DEFAULT_BRANCH}" "${PUSHED_SHA}"; then
            echo "Commit ${PUSHED_SHA} is already on ${DEFAULT_BRANCH}. Nothing to report."
            exit 0
          fi

          # The marker keeps one notice for each orphaned commit, so a rerun
          # adds no copy.
          marker="<!-- auto-merge:orphaned-push:${PUSHED_SHA} -->"
          if ! bodies="$(gh pr view "${number}" --json comments --jq '.comments[].body')"; then
            echo "::error::The comment list of pull request #${number} did not load."
            exit 1
          fi
          if printf '%s\n' "${bodies}" | grep -qF "${marker}"; then
            echo "Pull request #${number} already reports commit ${PUSHED_SHA}."
            exit 0
          fi

          # Each line stays flush left after YAML removes the block indent, so
          # Markdown reads the body as prose and not as a code block.
          cat > "${RUNNER_TEMP}/orphaned-push.md" <<EOF
          ${marker}
          **Warning: this push arrived after the merge, so the commit has no pull request.**

          Commit \`${PUSHED_SHA}\` reached branch \`${BRANCH}\` after the merge of
          pull request #${number}. A merged pull request stops reading its branch,
          so no reviewer and no gate reads this commit.

          The commit is safe on the remote, but it is not on \`${DEFAULT_BRANCH}\`.
          To deliver the work, start a new branch from \`${DEFAULT_BRANCH}\`, copy
          the commits that came after the merge onto it, and open a pull request.

          \`\`\`
          git fetch origin
          git switch -c recover-${BRANCH} origin/${DEFAULT_BRANCH}
          git cherry-pick ${merged_head}..${PUSHED_SHA}
          \`\`\`

          After a merge, put the next work on a new branch.
          jmorrison-juniper/MistHelper#1960 records a loss of work from this cause.
          EOF

          gh pr comment "${number}" --body-file "${RUNNER_TEMP}/orphaned-push.md"
          echo "Reported commit ${PUSHED_SHA} on pull request #${number}."
