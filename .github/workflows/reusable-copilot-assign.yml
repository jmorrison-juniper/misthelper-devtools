# ================================================================
# Copilot assign -- give one issue to the Copilot cloud agent
# ================================================================
# The job asks GitHub to assign the Copilot cloud agent to one issue. Then it
# reads the assignees in the response. It adds the in-progress label only when
# the agent is an assignee. When the agent is not an assignee, the job writes
# one comment on the issue that gives the cause. A later run updates that
# comment and does not add a new one.
#
# GitHub assigns the agent only for a user token: a personal access token or
# a GitHub App user-to-server token. For GITHUB_TOKEN, GitHub ignores the
# agent login and returns no error. Put a user token in a repository secret
# and pass that secret as assign-token. A fine-grained token needs read access
# to metadata, and read and write access to actions, contents, issues, and
# pull requests. A classic token needs the repo scope. The token user must
# have a Copilot plan that includes the cloud agent.
#
# Checkbox caller (an issue form with the "Assign to Copilot Coding Agent"
# checkbox):
#
#   on:
#     issues:
#       types: [opened]
#   jobs:
#     assign:
#       permissions:
#         issues: write
#       uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-copilot-assign.yml@<commit>
#       with:
#         issue-number: ${{ github.event.issue.number }}
#         require-checkbox: true
#         add-copilot-label: true
#       secrets:
#         assign-token: ${{ secrets.COPILOT_ASSIGN_TOKEN }}
#
# The job assigns the agent itself. A label that GITHUB_TOKEN adds starts no
# labeled workflow, so a chain of two workflows stops after the label.
#
# The result output is one of these values:
#   assigned          The agent is an assignee now.
#   already-assigned  The agent was an assignee before the run.
#   no-checkbox       require-checkbox is true and the checkbox is not checked.
#   no-token          The caller gave no assign-token secret.
#   ready             Dry run only: the token user can assign the agent.
#   not-available     The token user cannot assign the agent in the repository.
#   not-assigned      GitHub accepted the request, but the agent is not an assignee.
#   error             GitHub returned an error for the request.
# ================================================================
name: Copilot assign (reusable)

on:
  workflow_call:
    inputs:
      issue-number:
        description: The number of the issue for the agent.
        required: true
        type: string
      require-checkbox:
        description: Assign only when the issue body has the checked Copilot checkbox.
        required: false
        default: false
        type: boolean
      add-copilot-label:
        description: Add the Copilot label to the issue before the assignment.
        required: false
        default: false
        type: boolean
      copilot-label:
        description: The label that marks an issue for the agent.
        required: false
        default: copilot
        type: string
      in-progress-label:
        description: The label to add after the agent becomes an assignee.
        required: false
        default: in-progress
        type: string
      assignee:
        description: The login of the agent in the REST request.
        required: false
        default: copilot-swe-agent[bot]
        type: string
      dry-run:
        description: Read the issue and report each planned change, but change nothing.
        required: false
        default: false
        type: boolean
    secrets:
      assign-token:
        description: A user token that can assign the Copilot cloud agent. Without it, the job writes a comment that tells how to set it up.
        required: false
    outputs:
      result:
        description: The result of the run. The file header gives each value.
        value: ${{ jobs.assign-copilot.outputs.result }}

jobs:
  assign-copilot:
    name: Assign the Copilot cloud agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The job reads the issue, adds labels, and writes or updates a comment.
      # The assignment request uses the assign-token secret, not this token.
      issues: write
    outputs:
      # github-script writes its own result output from the return value of the
      # script, so the step uses the name assign-result.
      result: ${{ steps.assign.outputs.assign-result }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Assign the agent to the issue
        id: assign
        uses: actions/github-script@v9
        env:
          # The inputs go through the environment, so no input text becomes
          # script code.
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          REQUIRE_CHECKBOX: ${{ inputs.require-checkbox }}
          ADD_COPILOT_LABEL: ${{ inputs.add-copilot-label }}
          COPILOT_LABEL: ${{ inputs.copilot-label }}
          IN_PROGRESS_LABEL: ${{ inputs.in-progress-label }}
          ASSIGNEE: ${{ inputs.assignee }}
          DRY_RUN: ${{ inputs.dry-run }}
          ASSIGN_TOKEN: ${{ secrets.assign-token }}
        with:
          script: |
            const MARKER = '<!-- misthelper-devtools:copilot-assign -->';
            const MANUAL = 'To start the work now, assign Copilot in the issue sidebar, or ask Copilot Chat in VS Code to work on this issue.';
            const dryRun = process.env.DRY_RUN === 'true';
            const say = (text) => core.info(dryRun ? `[dry run] ${text}` : text);
            const finish = (result) => {
              core.setOutput('assign-result', result);
              say(`Result: ${result}.`);
            };
            // The REST request uses copilot-swe-agent[bot]. The issue shows the agent as Copilot.
            const isAgent = (user) => /^copilot(-swe-agent)?(\[bot\])?$/i.test((user && user.login) || '');

            const raw = (process.env.ISSUE_NUMBER || '').trim();
            if (!/^[0-9]+$/.test(raw)) {
              core.setOutput('assign-result', 'error');
              core.setFailed(`The issue number must be a whole number. It is '${raw}'.`);
              return;
            }
            const issue_number = Number(raw);
            const { owner, repo } = context.repo;
            const assignee = process.env.ASSIGNEE;
            const inProgressLabel = process.env.IN_PROGRESS_LABEL;
            const token = process.env.ASSIGN_TOKEN || '';

            // Read the issue from the API, because a dispatch run has no issue
            // in the event payload.
            const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });

            if (process.env.REQUIRE_CHECKBOX === 'true') {
              const pattern = /\[x\]\s*Assign to Copilot Coding Agent/i;
              if (!pattern.test(issue.body || '')) {
                say(`Issue #${issue_number} has no checked Copilot checkbox. Skipping.`);
                finish('no-checkbox');
                return;
              }
              say(`Issue #${issue_number} has the checked Copilot checkbox.`);
            }

            if ((issue.assignees || []).some(isAgent)) {
              say(`The agent is already an assignee of issue #${issue_number}.`);
              finish('already-assigned');
              return;
            }

            if (process.env.ADD_COPILOT_LABEL === 'true') {
              const label = process.env.COPILOT_LABEL;
              if (dryRun) {
                say(`Would add the ${label} label to issue #${issue_number}.`);
              } else {
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [label] });
                core.info(`Added the ${label} label to issue #${issue_number}.`);
              }
            }

            // Keep one comment on each issue, and update it on a later run.
            async function report(result, summary, details) {
              const body = [MARKER, '**The Copilot cloud agent was not assigned.**', '', summary, ...details, '', MANUAL].join('\n');
              if (dryRun) {
                say(`${summary} Would write or update this comment on issue #${issue_number}:\n${body}`);
              } else {
                core.warning(`Issue #${issue_number}: ${summary}`);
                const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                const previous = comments.find((comment) => comment.user && comment.user.type === 'Bot' && (comment.body || '').includes(MARKER));
                if (previous) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
                  core.info(`Updated the comment ${previous.html_url}.`);
                } else {
                  const { data: comment } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
                  core.info(`Wrote the comment ${comment.html_url}.`);
                }
              }
              finish(result);
            }

            if (!token) {
              await report('no-token', 'The workflow has no `assign-token` secret. GitHub assigns the agent only for a user token, and `GITHUB_TOKEN` cannot do it.', [
                '',
                'To set up the assignment, a repository admin can:',
                '',
                '1. Make a fine-grained personal access token for this repository. Give it read access to metadata, and read and write access to actions, contents, issues, and pull requests. A classic token needs the `repo` scope. The token user must have a Copilot plan that includes the cloud agent.',
                '2. Save the token as a repository secret, for example `COPILOT_ASSIGN_TOKEN`.',
                '3. In the caller workflow, pass that secret as `assign-token`.',
              ]);
              return;
            }

            const agent = getOctokit(token);

            // The agent is in suggestedActors only when the token user can
            // assign it in this repository.
            async function agentIsAvailable() {
              const query = `query($owner: String!, $name: String!) {
                repository(owner: $owner, name: $name) {
                  suggestedActors(capabilities: [CAN_BE_ASSIGNED], first: 100) { nodes { login } }
                }
              }`;
              const data = await agent.graphql(query, {
                owner,
                name: repo,
                headers: { 'GraphQL-Features': 'issues_copilot_assignment_api_support' },
              });
              return data.repository.suggestedActors.nodes.some((node) => /^copilot-swe-agent/i.test(node.login || ''));
            }

            const notAvailable = 'The Copilot cloud agent is not available to the token user in this repository.';
            const notAvailableDetails = [
              '',
              'Make sure that the token user has a Copilot plan that includes the cloud agent, and that the Copilot policy lets the cloud agent work in this repository.',
            ];

            try {
              if (dryRun) {
                if (await agentIsAvailable()) {
                  say(`The token user can assign the agent. Would assign ${assignee} to issue #${issue_number}, then add the ${inProgressLabel} label.`);
                  finish('ready');
                } else {
                  await report('not-available', notAvailable, notAvailableDetails);
                }
                return;
              }

              const { data } = await agent.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [assignee] });
              const logins = (data.assignees || []).map((user) => user.login);
              if ((data.assignees || []).some(isAgent)) {
                core.info(`Assigned the agent to issue #${issue_number}. The assignees are: ${logins.join(', ')}.`);
                await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [inProgressLabel] });
                core.info(`Added the ${inProgressLabel} label to issue #${issue_number}.`);
                finish('assigned');
                return;
              }

              // GitHub drops an assignee that it cannot assign and returns no error.
              const available = await agentIsAvailable().catch((error) => {
                core.info(`Could not read the actors that can be assigned: ${error.message}`);
                return null;
              });
              const after = `The assignees after the request: ${logins.length ? logins.join(', ') : 'none'}.`;
              if (available === false) {
                await report('not-available', notAvailable, [...notAvailableDetails, '', after]);
              } else {
                await report('not-assigned', `GitHub accepted the request for ${assignee}, but the agent is not an assignee.`, ['', after]);
              }
            } catch (error) {
              await report('error', `GitHub returned an error for the assignment request: ${error.message}`, [
                '',
                'A 401 error means that the `assign-token` secret is not valid or has expired. A 403 or 404 error means that the token cannot write issues in this repository.',
              ]);
            }