# ================================================================
# Copilot assign -- give one issue to the Copilot coding agent
# ================================================================
# The job assigns the agent to one issue and adds the in-progress label. When
# the assignment fails, the job writes a comment that gives the usual causes,
# so the failure is visible on the issue.
#
# Checkbox caller (an issue form with the "Assign to Copilot Coding Agent"
# checkbox):
#
#   on:
#     issues:
#       types: [opened]
#   jobs:
#     assign:
#       permissions:
#         issues: write
#       uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-copilot-assign.yml@<commit>
#       with:
#         issue-number: ${{ github.event.issue.number }}
#         require-checkbox: true
#         add-copilot-label: true
#
# The job assigns the agent itself. A label that GITHUB_TOKEN adds starts no
# labeled workflow, so a chain of two workflows stops after the label.
# ================================================================
name: Copilot assign (reusable)

on:
  workflow_call:
    inputs:
      issue-number:
        description: The number of the issue for the agent.
        required: true
        type: string
      require-checkbox:
        description: Assign only when the issue body has the checked Copilot checkbox.
        required: false
        default: false
        type: boolean
      add-copilot-label:
        description: Add the Copilot label to the issue before the assignment.
        required: false
        default: false
        type: boolean
      copilot-label:
        description: The label that marks an issue for the agent.
        required: false
        default: copilot
        type: string
      in-progress-label:
        description: The label to add after the assignment.
        required: false
        default: in-progress
        type: string
      assignee:
        description: The login of the agent.
        required: false
        default: copilot
        type: string

jobs:
  assign-copilot:
    name: Assign the Copilot coding agent
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # The job reads the issue, adds labels and an assignee, and can comment.
      issues: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Assign the agent to the issue
        uses: actions/github-script@v9
        env:
          # The inputs go through the environment, so no input text becomes
          # script code.
          ISSUE_NUMBER: ${{ inputs.issue-number }}
          REQUIRE_CHECKBOX: ${{ inputs.require-checkbox }}
          ADD_COPILOT_LABEL: ${{ inputs.add-copilot-label }}
          COPILOT_LABEL: ${{ inputs.copilot-label }}
          IN_PROGRESS_LABEL: ${{ inputs.in-progress-label }}
          ASSIGNEE: ${{ inputs.assignee }}
        with:
          script: |
            const raw = (process.env.ISSUE_NUMBER || '').trim();
            if (!/^[0-9]+$/.test(raw)) {
              core.setFailed(`The issue number must be a whole number. It is '${raw}'.`);
              return;
            }
            const issue_number = Number(raw);
            const { owner, repo } = context.repo;
            const assignee = process.env.ASSIGNEE;

            if (process.env.REQUIRE_CHECKBOX === 'true') {
              // Read the body from the API, because a dispatch run has no issue
              // in the event payload.
              const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number });
              const pattern = /\[x\]\s*Assign to Copilot Coding Agent/i;
              if (!pattern.test(issue.body || '')) {
                core.info(`Issue #${issue_number} has no checked Copilot checkbox. Skipping.`);
                return;
              }
              core.info(`Issue #${issue_number} has the checked Copilot checkbox.`);
            }

            if (process.env.ADD_COPILOT_LABEL === 'true') {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [process.env.COPILOT_LABEL] });
              core.info(`Added the ${process.env.COPILOT_LABEL} label to issue #${issue_number}.`);
            }

            try {
              const { data } = await github.rest.issues.addAssignees({ owner, repo, issue_number, assignees: [assignee] });
              const logins = (data.assignees || []).map((user) => user.login).join(', ') || 'none';
              core.info(`Sent the assignment of ${assignee} to issue #${issue_number}. Assignees now: ${logins}.`);

              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [process.env.IN_PROGRESS_LABEL] });
            } catch (error) {
              core.warning(`Could not assign ${assignee}: ${error.message}`);

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  '**Copilot Coding Agent could not be assigned.**',
                  '',
                  'This usually means one of:',
                  '- The repository owner account does not have a Copilot Business/Enterprise seat',
                  '- The Copilot Coding Agent policy is not enabled in org/account settings',
                  '',
                  'To implement manually: open VS Code and ask Copilot Chat to work this issue.',
                  '',
                  `Error: \`${error.message}\``
                ].join('\n')
              });
            }
