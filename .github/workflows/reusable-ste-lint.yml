# ================================================================
# STE lint -- grade documentation against the Simplified Technical English rules
# ================================================================
# The job grades each file with the ste-linter command of this repository. The
# job fails when a file scores below the threshold. The report goes to the run
# log and to the job summary.
#
# The caller workflow:
#
#   on:
#     pull_request:
#       paths:
#         - 'documentation/**/*.md'
#         - '.ste-linter.toml'
#         - '.github/workflows/ste-lint.yml'
#     workflow_dispatch:
#   permissions: {}
#   jobs:
#     ste-lint:
#       permissions:
#         contents: read
#       uses: jmorrison-juniper/misthelper-devtools/.github/workflows/reusable-ste-lint.yml@<commit>
#       with:
#         files: documentation/ASD-STE100_writing-guide.md
#         config: .ste-linter.toml
#
# The job checks out this repository at the commit that the caller pins, so
# the linter and the workflow come from the same commit. The job also runs the
# devtools-pin-check command, which writes a warning when a requirement of the
# caller installs this repository at a different commit. The ASD-STE100
# dictionary is copyrighted, so the job has no dictionary. The linter then
# runs the structural checks only.
#
# The spaCy backend with the en_core_web_sm model is the reference backend. The
# job installs the grammar extra and a pinned model wheel, and it stops when the
# model does not load. Thus CI and a workstation give the same score.
# ================================================================
name: STE lint (reusable)

on:
  workflow_call:
    inputs:
      files:
        description: The Markdown or Python files to grade. Separate the entries with spaces or new lines. An entry can be a bash glob, and ** matches each directory level.
        required: true
        type: string
      config:
        description: The TOML file with the [tool.ste_linter] table. An empty value reads pyproject.toml when it exists.
        required: false
        default: ''
        type: string
      min-score:
        description: The pass threshold for each file, from 0 to 100.
        required: false
        default: 80
        type: number
      python-version:
        description: The Python version that runs the linter.
        required: false
        default: '3.13'
        type: string

jobs:
  ste-lint:
    name: STE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The job reads the caller files and this repository.
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out the shared tooling
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .misthelper-devtools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: .misthelper-devtools/pyproject.toml

      # The spaCy backend is the reference backend, so CI installs the same
      # grammar extra and model as a workstation. The model wheel is pinned by
      # URL and hash. The spaCy range matches the minor version of the model.
      - name: Install the shared tooling and the reference backend
        shell: bash
        env:
          SPACY_MODEL: en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl#sha256=1932429db727d4bff3deed6b34cfc05df17794f4a52eeb26cf8928f7c1a0fb85
        run: python -m pip install --disable-pip-version-check "./.misthelper-devtools[grammar]" "spacy>=3.8,<3.9" "${SPACY_MODEL}"

      # The linter falls back to the standard-library backend with no message
      # when the model does not load. That fallback changes the score, so the
      # job stops here.
      - name: Confirm the reference backend
        shell: bash
        run: |
          python -c "import spacy; spacy.load('en_core_web_sm'); print('STE backend: spaCy', spacy.__version__, 'with en_core_web_sm')"

      # Dependabot moves the workflow pins of the caller, but not a requirement
      # that installs this repository from a Git commit. The check writes a
      # warning with the new text of each such line that names another commit.
      # The check is a notice for the reviewer, so it never fails the job.
      - name: Compare the requirement pin with this workflow
        continue-on-error: true
        shell: bash
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        run: devtools-pin-check --commit "${WORKFLOW_SHA}" --repository "${WORKFLOW_REPOSITORY}"

      - name: Grade the files
        shell: bash
        env:
          FILES: ${{ inputs.files }}
          CONFIG: ${{ inputs.config }}
          MIN_SCORE: ${{ inputs.min-score }}
        run: |
          set -euo pipefail
          # A pattern that matches no file must not reach the linter as text.
          shopt -s globstar nullglob

          args=(--min-score "${MIN_SCORE}")
          if [ -n "${CONFIG}" ]; then
            if [ ! -f "${CONFIG}" ]; then
              echo "::error::The config file '${CONFIG}' does not exist."
              exit 1
            fi
            args+=(--config "${CONFIG}")
          fi

          read -r -d '' -a patterns <<< "${FILES}" || true
          targets=()
          for pattern in "${patterns[@]}"; do
            # The unquoted pattern expands the glob.
            # shellcheck disable=SC2206
            matches=(${pattern})
            if [ "${#matches[@]}" -eq 0 ]; then
              echo "::error::The entry '${pattern}' matches no file."
              exit 1
            fi
            targets+=("${matches[@]}")
          done
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::The files input names no file."
            exit 1
          fi

          echo "Grading ${#targets[@]} file(s) with a threshold of ${MIN_SCORE}."
          status=0
          ste-linter "${args[@]}" "${targets[@]}" | tee "${RUNNER_TEMP}/ste-report.txt" || status=$?

          {
            echo "## STE lint"
            echo ""
            echo '```text'
            cat "${RUNNER_TEMP}/ste-report.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${status}" -ne 0 ]; then
            echo "::error::A file scored below ${MIN_SCORE}, or the linter failed. Read the report above."
          fi
          exit "${status}"
