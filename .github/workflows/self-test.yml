name: Self-test

# Each reusable workflow that a Mist repository calls runs here first. A
# change to a reusable workflow must pass this test before a consumer pins the
# new commit. Each run that could change the repository uses dry-run. The CI
# workflow calls reusable-ste-lint.yml on each pull request, so this workflow
# does not call it. That CI call installs the spaCy reference backend and stops
# when the model does not load, so each pull request tests that path.
on:
  pull_request:
    paths:
      - '.github/workflows/reusable-*.yml'
      - '.github/workflows/self-test.yml'
      - 'tests/fixtures/container/**'
      - 'tests/fixtures/python-gates/**'
      - 'src/misthelper_devtools/devtools_pin_check.py'
      - 'src/misthelper_devtools/stranded_branch_report.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/reusable-*.yml'
      - '.github/workflows/self-test.yml'
      - 'tests/fixtures/container/**'
      - 'tests/fixtures/python-gates/**'
      - 'src/misthelper_devtools/devtools_pin_check.py'
      - 'src/misthelper_devtools/stranded_branch_report.py'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  container-image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable-container-image.yml
    with:
      context: tests/fixtures/container
      file: tests/fixtures/container/Dockerfile
      push: false
      version-tag: true
      build-args: |
        VERSION={version}
      tags: |
        type=ref,event=branch
        type=ref,event=pr
        type=sha,prefix=

  check-container-image:
    name: Check the container image outputs
    needs: container-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      VERSION: ${{ needs.container-image.outputs.version }}
      IMAGE: ${{ needs.container-image.outputs.image }}
      TAGS: ${{ needs.container-image.outputs.tags }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check the version, the image name, and the tags
        shell: bash
        run: |
          set -euo pipefail
          echo "Version: ${VERSION}"
          echo "Image: ${IMAGE}"
          printf 'Tags:\n%s\n' "${TAGS}"

          if ! [[ "${VERSION}" =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "::error::The version '${VERSION}' does not have the YY.MM.DD.HH.MM form."
            exit 1
          fi
          expected="ghcr.io/${REPOSITORY,,}"
          if [ "${IMAGE}" != "${expected}" ]; then
            echo "::error::The image is '${IMAGE}'. The expected image is '${expected}'."
            exit 1
          fi
          if ! grep -qxF "${IMAGE}:${VERSION}" <<< "${TAGS}"; then
            echo "::error::The tags do not include the version tag ${IMAGE}:${VERSION}."
            exit 1
          fi
          echo "The container image outputs are correct."

  quality-gate-issues:
    permissions:
      issues: write
      pull-requests: read
    uses: ./.github/workflows/reusable-quality-gate-issues.yml
    with:
      # One object result, one plain result, and one skipped gate.
      results: '{"lint":{"result":"success","outputs":{}},"tests":{"result":"failure","outputs":{}},"docs":"skipped"}'
      scope: all
      dry-run: true
      fail-on-error: true

  # The sample project passes each gate, so each gate job runs and passes.
  python-quality-gates:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-python-quality-gates.yml
    with:
      working-directory: tests/fixtures/python-gates
      install: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      cache-dependency-path: tests/fixtures/python-gates/requirements-dev.txt
      ruff: true
      ruff-format: true
      black: true
      mypy: true
      pytest: true
      pytest-args: --cov=sample_gates --cov-fail-under=100
      bandit: true
      pip-audit: true
      pylint: true
      radon: true
      radon-max: 10
      vulture: true
      pydocstyle: true
      interrogate: true
      pydoclint: true

  check-python-quality-gates:
    name: Check the Python quality gate results
    needs: python-quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      RESULTS: ${{ needs.python-quality-gates.outputs.results }}
    steps:
      - name: Check that each gate ran and passed
        shell: bash
        run: |
          set -euo pipefail
          echo "Results: ${RESULTS}"
          expected="bandit black interrogate mypy pip_audit pydoclint pydocstyle pylint pytest radon ruff ruff_format vulture"
          actual="$(jq -r 'keys | join(" ")' <<< "${RESULTS}")"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::The results name the gates '${actual}'. The expected gates are '${expected}'."
            exit 1
          fi
          failed="$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(" ")' <<< "${RESULTS}")"
          if [ -n "${failed}" ]; then
            echo "::error::These gates did not pass: ${failed}."
            exit 1
          fi
          echo "The Python quality gate results are correct."

  # The gate issues workflow reads the results output of the gate workflow.
  python-quality-gate-issues:
    needs: python-quality-gates
    if: ${{ always() }}
    permissions:
      issues: write
      pull-requests: read
    uses: ./.github/workflows/reusable-quality-gate-issues.yml
    with:
      results: ${{ needs.python-quality-gates.outputs.results }}
      scope: all
      dry-run: true
      fail-on-error: true
  close-linked-issues:
    permissions:
      issues: write
      pull-requests: read
    uses: ./.github/workflows/reusable-close-linked-issues.yml
    with:
      sweep: true
      lookback-hours: '720'
      dry-run: true

  # The report reads this repository. A zero quiet period makes the command
  # read every branch, and the dry run leaves the issues unchanged.
  stranded-branch-report:
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/reusable-stranded-branch-report.yml
    with:
      min-age-days: 0
      dry-run: true

  # The issues API treats a pull request as an issue. A push or a manual run
  # reads pull request 5, which is merged. The self-test passes no
  # assign-token secret.
  copilot-assign:
    permissions:
      issues: write
    uses: ./.github/workflows/reusable-copilot-assign.yml
    with:
      issue-number: ${{ github.event.pull_request.number || '5' }}
      add-copilot-label: true
      dry-run: true

  copilot-assign-checkbox:
    permissions:
      issues: write
    uses: ./.github/workflows/reusable-copilot-assign.yml
    with:
      issue-number: ${{ github.event.pull_request.number || '5' }}
      require-checkbox: true
      dry-run: true

  check-copilot-assign:
    name: Check the Copilot assign results
    needs: [copilot-assign, copilot-assign-checkbox]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      NO_TOKEN_RESULT: ${{ needs.copilot-assign.outputs.result }}
      CHECKBOX_RESULT: ${{ needs.copilot-assign-checkbox.outputs.result }}
    steps:
      - name: Check the results
        shell: bash
        run: |
          set -euo pipefail
          echo "Result without a token: ${NO_TOKEN_RESULT}"
          echo "Result without a checkbox: ${CHECKBOX_RESULT}"
          if [ "${NO_TOKEN_RESULT}" != "no-token" ]; then
            echo "::error::The result without a token is '${NO_TOKEN_RESULT}'. The expected result is 'no-token'."
            exit 1
          fi
          if [ "${CHECKBOX_RESULT}" != "no-checkbox" ]; then
            echo "::error::The result without a checkbox is '${CHECKBOX_RESULT}'. The expected result is 'no-checkbox'."
            exit 1
          fi
          echo "The Copilot assign results are correct."
