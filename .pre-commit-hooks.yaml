# The pre-commit hooks of this repository. A Mist repository lists this
# repository in its .pre-commit-config.yaml at a release tag:
#
#   - repo: https://github.com/jmorrison-juniper/misthelper-devtools
#     rev: v0.5.0
#     hooks:
#       - id: ste-linter
#         args: [--config, .ste-linter.toml, --min-score, "80"]
#
# pre-commit installs this package at that tag in its own environment, so the
# hook and the CI gate run the same linter release.
- id: ste-linter
  name: STE writing linter
  description: Grade Markdown and Python prose against the Simplified Technical English rules.
  entry: ste-linter
  language: python
  types_or: [markdown, python]
